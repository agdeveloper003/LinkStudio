name: 4 - Rayleigh fading
category: Tutorials
description: BPSK through a fast Rayleigh channel with coherent zero-forcing equalization.
  Sweep awgn.snr_db against the BPSK Rayleigh theory and compare with AWGN.
seed: 1
batch_size: 32
blocks:
  src:
    type: random_bits
    params:
      n_bits: 2000
  map:
    type: mapper
    params:
      scheme: psk
      order: 2
  fad:
    type: flat_fading
    params:
      variation: fast
  awgn:
    type: awgn
    params:
      snr_db: 15.0
  eq:
    type: one_tap_equalizer
  demap:
    type: demapper
  ber:
    type: ber_meter
edges:
- src.out -> map.in
- map.out -> fad.in
- fad.out -> awgn.in
- awgn.out -> eq.in
- eq.out -> demap.in
- demap.out -> ber.rx
- fad.csi -> eq.csi
- src.out -> ber.tx
probes:
- key: awgn.out
  view: constellation
- key: eq.out
  view: constellation
- key: fad.csi
  view: csi
layout:
  src:
  - 40.0
  - 66.0
  map:
  - 362.0
  - 40.0
  fad:
  - 637.0
  - 111.0
  awgn:
  - 935.0
  - 107.0
  eq:
  - 892.0
  - 368.0
  demap:
  - 624.0
  - 347.0
  ber:
  - 352.0
  - 328.0
port_layout:
  eq:
    in:in:
    - right
    - 0.25
    in:csi:
    - right
    - 0.75
    out:out:
    - left
    - 0.25
  demap:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
