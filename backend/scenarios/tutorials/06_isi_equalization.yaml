name: 6 - ISI and adaptive equalization
category: Tutorials
description: A static three-path channel smears QPSK symbols together. The NLMS equalizer
  learns the inverse from 200 training symbols and then tracks with its own decisions.
seed: 1
batch_size: 16
blocks:
  src:
    type: random_bits
    params:
      n_bits: 4000
  map:
    type: mapper
    params:
      scheme: psk
  ch:
    type: multipath
    params:
      powers_db:
      - 0.0
      - -2.0
      - -6.0
      fading: false
  awgn:
    type: awgn
    params:
      snr_db: 14.0
  eq:
    type: lms_equalizer
    params:
      n_taps: 15
  demap:
    type: demapper
    params:
      method: hard
  ber:
    type: ber_meter
    params:
      skip_bits: 400
edges:
- src.out -> map.in
- map.out -> ch.in
- ch.out -> awgn.in
- awgn.out -> eq.in
- eq.out -> demap.in
- demap.out -> ber.rx
- map.out -> eq.ref
- src.out -> ber.tx
probes:
- key: awgn.out
  view: constellation
- key: eq.out
  view: constellation
- key: ch.csi
  view: csi
layout:
  src:
  - 40.0
  - 66.0
  map:
  - 362.0
  - 40.0
  ch:
  - 632.0
  - 111.0
  awgn:
  - 935.0
  - 107.0
  eq:
  - 892.0
  - 368.0
  demap:
  - 624.0
  - 347.0
  ber:
  - 352.0
  - 328.0
port_layout:
  eq:
    in:in:
    - right
    - 0.25
    in:ref:
    - right
    - 0.75
    out:out:
    - left
    - 0.25
  demap:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
