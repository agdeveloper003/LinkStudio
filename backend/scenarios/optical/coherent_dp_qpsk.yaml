name: Coherent DP-QPSK long haul
category: Optical
description: 128 Gb/s dual-polarization QPSK over 20 x 80 km of amplified fiber with random
  polarization, 1 GHz LO offset and 100 kHz lasers, recovered by the coherent DSP chain.
  Sweep mod.power_dbm to trade OSNR against Kerr nonlinearity (enable link.nonlinear).
seed: 2
batch_size: 4
blocks:
  src: {type: random_bits, params: {n_bits: 8000}}
  map: {type: mapper, params: {scheme: psk, order: 4, symbol_rate: 32000000000.0}}
  dmx: {type: stream_demux, params: {n_streams: 2}}
  tx: {type: pulse_shaper, params: {sps: 2, rolloff: 0.1, span: 32}}
  mod: {type: iq_modulator, params: {power_dbm: -6.0, linewidth_hz: 100000.0}}
  link: {type: optical_link, params: {n_spans: 20, span_km: 80.0, polarization_rotation: true}}
  rx: {type: coherent_receiver, params: {frequency_offset_hz: 1000000000.0, lo_linewidth_hz: 100000.0}}
  cdc: {type: cd_compensation}
  fo: {type: fo_compensation}
  mf: {type: matched_filter, params: {decimate: false}}
  agc: {type: agc, params: {remove_dc: false}}
  eq: {type: adaptive_mimo_equalizer}
  cpr: {type: phase_recovery}
  mux: {type: stream_mux}
  demap: {type: demapper, params: {method: hard}}
  ber: {type: ber_meter, params: {skip_bits: 2400}}
  evm: {type: evm_meter, params: {skip_symbols: 1200}}
chain: [src, map, dmx, tx, mod, link, rx, cdc, fo, mf, agc, eq, cpr, mux, demap, ber.rx]
edges:
  - dmx.out -> eq.ref
  - dmx.out -> cpr.ref
  - src.out -> ber.tx
  - map.out -> evm.ref
  - mux.out -> evm.in
probes:
  - {key: rx.out, view: constellation}
  - {key: mf.out, view: constellation}
  - {key: eq.out, view: constellation}
  - {key: cpr.out, view: constellation}
