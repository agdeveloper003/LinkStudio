name: Coherent DP-QPSK long haul
category: Optical
description: 128 Gb/s dual-polarization QPSK over 20 x 80 km of amplified fiber with
  random polarization, 1 GHz LO offset and 100 kHz lasers, recovered by the coherent
  DSP chain. Sweep mod.power_dbm to trade OSNR against Kerr nonlinearity (enable link.nonlinear).
seed: 2
batch_size: 4
blocks:
  src:
    type: random_bits
    params:
      n_bits: 8000
  map:
    type: mapper
    params:
      scheme: psk
      symbol_rate: 32000000000.0
  dmx:
    type: stream_demux
  tx:
    type: pulse_shaper
    params:
      sps: 2
      span: 32
      rolloff: 0.1
  mod:
    type: iq_modulator
    params:
      power_dbm: -6.0
  link:
    type: optical_link
    params:
      polarization_rotation: true
      n_spans: 20
  rx:
    type: coherent_receiver
    params:
      frequency_offset_hz: 1000000000.0
  cdc:
    type: cd_compensation
  fo:
    type: fo_compensation
  mf:
    type: matched_filter
    params:
      decimate: false
  agc:
    type: agc
    params:
      remove_dc: false
  eq:
    type: adaptive_mimo_equalizer
  cpr:
    type: phase_recovery
  mux:
    type: stream_mux
  demap:
    type: demapper
    params:
      method: hard
  ber:
    type: ber_meter
    params:
      skip_bits: 2400
  evm:
    type: evm_meter
    params:
      skip_symbols: 1200
edges:
- src.out -> map.in
- map.out -> dmx.in
- dmx.out -> tx.in
- tx.out -> mod.in
- mod.out -> link.in
- link.out -> rx.in
- rx.out -> cdc.in
- cdc.out -> fo.in
- fo.out -> mf.in
- mf.out -> agc.in
- agc.out -> eq.in
- eq.out -> cpr.in
- cpr.out -> mux.in
- mux.out -> demap.in
- demap.out -> ber.rx
- dmx.out -> eq.ref
- dmx.out -> cpr.ref
- src.out -> ber.tx
- map.out -> evm.ref
- mux.out -> evm.in
probes:
- key: rx.out
  view: constellation
- key: mf.out
  view: constellation
- key: eq.out
  view: constellation
- key: cpr.out
  view: constellation
