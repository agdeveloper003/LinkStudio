name: 10G OOK with a Mach-Zehnder modulator and the dispersion limit
category: Optical
description: 10 Gb/s NRZ-OOK from a DFB laser and a push-pull lithium-niobate MZM
  (quadrature bias, full swing, 4 dB insertion loss) over standard single-mode fiber
  at 1550 nm into a PIN receiver. The chirp-free signal is limited by chromatic dispersion
  near L = 1/(10 D R_B^2) = 62.5 km; sweep fib.length_km from 20 to 120 km to see
  the eye close, or set mod.drive to single_arm to add chirp.
seed: 1
batch_size: 16
blocks:
  src:
    type: random_bits
    params:
      n_bits: 4000
  lc:
    type: line_encoder
    params:
      symbol_rate: 10000000000.0
  tx:
    type: pulse_shaper
    params:
      shape: rc
      rolloff: 0.5
  mod:
    type: mach_zehnder_modulator
  fib:
    type: fiber
    params:
      fiber_type: smf
      connector_loss_db: 2.0
      length_km: 50.0
  opm:
    type: optical_power_meter
  pd:
    type: photodiode
    params:
      responsivity: 0.9
      bandwidth_ghz: 7.5
  rx:
    type: matched_filter
    params:
      shape: none
  agc:
    type: agc
  dec:
    type: line_decoder
  ber:
    type: ber_meter
edges:
- src.out -> lc.in
- lc.out -> tx.in
- tx.out -> mod.in
- mod.out -> fib.in
- fib.out -> pd.in
- pd.out -> rx.in
- rx.out -> agc.in
- agc.out -> dec.in
- dec.out -> ber.rx
- fib.out -> opm.in
- src.out -> ber.tx
probes:
- key: pd.out
  view: eye
- key: mod.out
  view: spectrum
layout:
  src:
  - 40.0
  - 238.0
  lc:
  - 352.0
  - 246.0
  tx:
  - 620.0
  - 246.0
  mod:
  - 896.0
  - 283.0
  fib:
  - 1161.0
  - 285.0
  opm:
  - 1283.0
  - 40.0
  pd:
  - 1156.0
  - 530.0
  rx:
  - 888.0
  - 493.0
  agc:
  - 656.0
  - 530.0
  dec:
  - 352.0
  - 493.0
  ber:
  - 60.0
  - 474.0
port_layout:
  pd:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  rx:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  agc:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dec:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
