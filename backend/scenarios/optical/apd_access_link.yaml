name: O-band access link with APD
category: Optical
description: 10 Gb/s OOK at 1310 nm (near-zero dispersion) over 40 km of fiber into an avalanche
  photodiode. Change pd.apd_gain to find the optimum between thermal and excess shot noise.
seed: 1
batch_size: 16
blocks:
  src: {type: random_bits, params: {n_bits: 4000}}
  lc: {type: line_encoder, params: {code: nrz, symbol_rate: 10000000000.0}}
  tx: {type: intensity_modulator, params: {power_dbm: -2.0, extinction_ratio_db: 9.0, wavelength_nm: 1310.0}}
  fib: {type: fiber, params: {length_km: 40.0, attenuation_db_km: 0.35, dispersion_ps_nm_km: 0.5}}
  opm: {type: optical_power_meter}
  pd: {type: photodiode, params: {apd_gain: 10.0, thermal_noise_pa_rthz: 25.0}}
  agc: {type: agc}
  dec: {type: line_decoder}
  ber: {type: ber_meter}
chain: [src, lc, tx, fib, pd, agc, dec, ber.rx]
edges:
  - fib.out -> opm.in
  - src.out -> ber.tx
probes:
  - {key: pd.out, view: time}
  - {key: agc.out, view: constellation}
