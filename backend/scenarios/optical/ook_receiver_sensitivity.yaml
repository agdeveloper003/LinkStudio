name: 10G OOK receiver sensitivity
category: Optical
description: Back-to-back NRZ-OOK at 10 Gb/s into a thermal-noise-limited PIN receiver.
  Sweep tx.power_dbm from -26 to -20 dBm to draw the classic sensitivity curve.
seed: 1
batch_size: 32
blocks:
  src:
    type: random_bits
    params:
      n_bits: 4000
  lc:
    type: line_encoder
    params:
      symbol_rate: 10000000000.0
  tx:
    type: intensity_modulator
    params:
      power_dbm: -22.0
  pd:
    type: photodiode
  agc:
    type: agc
  dec:
    type: line_decoder
  ber:
    type: ber_meter
edges:
- src.out -> lc.in
- lc.out -> tx.in
- tx.out -> pd.in
- pd.out -> agc.in
- agc.out -> dec.in
- dec.out -> ber.rx
- src.out -> ber.tx
probes:
- key: pd.out
  view: time
- key: agc.out
  view: constellation
layout:
  src:
  - 40.0
  - 40.0
  lc:
  - 354.0
  - 48.0
  tx:
  - 637.0
  - 85.0
  pd:
  - 892.0
  - 85.0
  agc:
  - 910.0
  - 332.0
  dec:
  - 624.0
  - 295.0
  ber:
  - 352.0
  - 276.0
port_layout:
  agc:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dec:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
