name: CRC + convolutional code over fading
category: Coding
description: A complete coded link - CRC-24A, rate-1/2 convolutional code and bit
  interleaving protect QPSK over fast Rayleigh fading. The CRC decoder reports the
  block error rate.
seed: 1
batch_size: 32
blocks:
  src:
    type: random_bits
    params:
      n_bits: 976
  crc:
    type: crc_encoder
    params:
      polynomial: crc24a
  enc:
    type: conv_encoder
  il:
    type: interleaver
  map:
    type: mapper
    params:
      scheme: psk
  fad:
    type: flat_fading
    params:
      variation: fast
  awgn:
    type: awgn
    params:
      snr_db: 8.0
  eq:
    type: one_tap_equalizer
  demap:
    type: demapper
  dil:
    type: interleaver
    params:
      inverse: true
  dec:
    type: viterbi_decoder
  crcd:
    type: crc_decoder
    params:
      polynomial: crc24a
  ber:
    type: ber_meter
edges:
- src.out -> crc.in
- crc.out -> enc.in
- enc.out -> il.in
- il.out -> map.in
- map.out -> fad.in
- fad.out -> awgn.in
- awgn.out -> eq.in
- eq.out -> demap.in
- demap.out -> dil.in
- dil.out -> dec.in
- dec.out -> crcd.in
- crcd.out -> ber.rx
- fad.csi -> eq.csi
- src.out -> ber.tx
probes:
- key: eq.out
  view: constellation
- key: demap.out
  view: histogram
layout:
  src:
  - 40.0
  - 66.0
  crc:
  - 354.0
  - 74.0
  enc:
  - 624.0
  - 74.0
  il:
  - 892.0
  - 74.0
  map:
  - 1168.0
  - 40.0
  fad:
  - 1441.0
  - 111.0
  awgn:
  - 1739.0
  - 107.0
  eq:
  - 1696.0
  - 368.0
  demap:
  - 1428.0
  - 347.0
  dil:
  - 1160.0
  - 347.0
  dec:
  - 892.0
  - 347.0
  crcd:
  - 624.0
  - 368.0
  ber:
  - 352.0
  - 328.0
port_layout:
  eq:
    in:in:
    - right
    - 0.25
    in:csi:
    - right
    - 0.75
    out:out:
    - left
    - 0.25
  demap:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dil:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dec:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  crcd:
    in:in:
    - right
    - 0.25
    out:out:
    - left
    - 0.25
    out:valid:
    - left
    - 0.75
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
