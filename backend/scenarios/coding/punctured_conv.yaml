name: Punctured convolutional code (rate 3/4)
category: Coding
description: The K=7 rate-1/2 mother code is punctured to rate 3/4 (IEEE 802.11 pattern).
  The depuncturer inserts erasures before soft Viterbi decoding.
seed: 1
batch_size: 32
blocks:
  src:
    type: random_bits
    params:
      n_bits: 1002
  enc:
    type: conv_encoder
  punc:
    type: puncturer
  map:
    type: mapper
    params:
      scheme: psk
  awgn:
    type: awgn
    params:
      snr_db: 5.0
  demap:
    type: demapper
  dpunc:
    type: depuncturer
  dec:
    type: viterbi_decoder
  ber:
    type: ber_meter
edges:
- src.out -> enc.in
- enc.out -> punc.in
- punc.out -> map.in
- map.out -> awgn.in
- awgn.out -> demap.in
- demap.out -> dpunc.in
- dpunc.out -> dec.in
- dec.out -> ber.rx
- src.out -> ber.tx
probes:
- key: awgn.out
  view: constellation
layout:
  src:
  - 40.0
  - 66.0
  enc:
  - 354.0
  - 74.0
  punc:
  - 624.0
  - 74.0
  map:
  - 900.0
  - 40.0
  awgn:
  - 1203.0
  - 107.0
  demap:
  - 1160.0
  - 347.0
  dpunc:
  - 892.0
  - 347.0
  dec:
  - 624.0
  - 347.0
  ber:
  - 352.0
  - 328.0
port_layout:
  demap:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dpunc:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dec:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
