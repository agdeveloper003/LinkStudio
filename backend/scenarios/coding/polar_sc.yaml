name: Polar code with SC decoding
category: Coding
description: Rate-1/2 polar code (N = 256) built with the Bhattacharyya construction and decoded by
  successive cancellation. Sweep awgn.snr_db from 0 to 4 dB with the BPSK theory as reference.
seed: 1
batch_size: 32
blocks:
  src: {type: random_bits, params: {n_bits: 512}}
  enc: {type: polar_encoder, params: {block_length: 256, k: 128, design_snr_db: 1.0}}
  map: {type: mapper, params: {scheme: psk, order: 2}}
  awgn: {type: awgn, params: {mode: ebn0, snr_db: 3.0}}
  demap: {type: demapper, params: {method: exact}}
  dec: {type: polar_decoder, params: {block_length: 256, k: 128, design_snr_db: 1.0}}
  ber: {type: ber_meter}
chain: [src, enc, map, awgn, demap, dec, ber.rx]
edges:
  - src.out -> ber.tx
probes:
  - {key: demap.out, view: histogram}
