name: ADSL-like DMT over a telephone pair
category: Wireline
description: Discrete multitone with water-filling bit loading over 2 km of 0.4 mm
  (26 AWG) twisted pair, modelled as an RLCG line with the ITU-T G.996.1 primary constants.
  Bit loading assumes 50 dB SNR to leave margin for the NEXT crosstalk; set dmt.snr_db
  to 60 to load more bits and watch the errors appear, or change the loop length.
seed: 1
batch_size: 4
blocks:
  src:
    type: random_bits
    params:
      n_bits: 12000
  dmt:
    type: dmt_modulator
    params:
      snr_db: 50.0
      line_preset: pic_26awg
  ch:
    type: copper_line
    params:
      preset: pic_26awg
      length_m: 2000.0
  xt:
    type: crosstalk
    params:
      n_disturbers: 5
      preset: pic_26awg
  awgn:
    type: awgn
    params:
      snr_db: 60.0
      mode: snr
  rx:
    type: dmt_demodulator
  ber:
    type: ber_meter
edges:
- src.out -> dmt.in
- dmt.out -> ch.in
- ch.out -> xt.in
- xt.out -> awgn.in
- awgn.out -> rx.in
- ch.csi -> rx.csi
- dmt.out -> xt.tx
- rx.out -> ber.rx
- src.out -> ber.tx
probes:
- key: dmt.out
  view: spectrum
- key: awgn.out
  view: spectrum
- key: ch.csi
  view: csi
layout:
  src:
  - 40.0
  - 40.0
  dmt:
  - 354.0
  - 48.0
  ch:
  - 637.0
  - 85.0
  xt:
  - 892.0
  - 85.0
  awgn:
  - 922.0
  - 328.0
  rx:
  - 624.0
  - 316.0
  ber:
  - 352.0
  - 276.0
port_layout:
  awgn:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  rx:
    in:in:
    - right
    - 0.25
    in:csi:
    - right
    - 0.75
    out:out:
    - left
    - 0.25
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
