port_layout:
  ctle:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  rx:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  agc:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  dfe:
    in:in:
    - right
    - 0.25
    in:ref:
    - right
    - 0.75
    out:out:
    - left
