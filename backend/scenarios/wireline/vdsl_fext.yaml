name: VDSL-like DMT with far-end crosstalk
category: Wireline
description: A wider DMT band (1024-point FFT, 8.8 MHz sampling) over 500 m of 0.5
  mm pair, with far-end crosstalk from 10 neighbouring lines. Short loops reach tens
  of Mb/s.
seed: 1
batch_size: 2
blocks:
  src:
    type: random_bits
    params:
      n_bits: 30000
  dmt:
    type: dmt_modulator
    params:
      n_fft: 1024
      cp_len: 80
      last_tone: 511
      sample_rate: 8832000.0
      snr_db: 45.0
      line_preset: dsl_0.5mm
      line_length_m: 500.0
  ch:
    type: copper_line
    params:
      preset: dsl_0.5mm
      length_m: 500.0
  xt:
    type: crosstalk
    params:
      model: fext
      preset: dsl_0.5mm
      length_m: 500.0
  awgn:
    type: awgn
    params:
      snr_db: 60.0
      mode: snr
  rx:
    type: dmt_demodulator
  ber:
    type: ber_meter
edges:
- src.out -> dmt.in
- dmt.out -> ch.in
- ch.out -> xt.in
- xt.out -> awgn.in
- awgn.out -> rx.in
- ch.csi -> rx.csi
- dmt.out -> xt.tx
- rx.out -> ber.rx
- src.out -> ber.tx
probes:
- key: dmt.out
  view: spectrum
- key: awgn.out
  view: spectrum
layout:
  src:
  - 40.0
  - 40.0
  dmt:
  - 354.0
  - 48.0
  ch:
  - 637.0
  - 85.0
  xt:
  - 892.0
  - 85.0
  awgn:
  - 922.0
  - 328.0
  rx:
  - 624.0
  - 316.0
  ber:
  - 352.0
  - 276.0
port_layout:
  awgn:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  rx:
    in:in:
    - right
    - 0.25
    in:csi:
    - right
    - 0.75
    out:out:
    - left
    - 0.25
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
