name: Line code spectra
category: Wireline
description: The same bits encoded with NRZ, Manchester, AMI and MLT-3 at 100 Mb/s.
  Compare the four spectra in Live mode - DC content, bandwidth and spectral nulls.
seed: 1
batch_size: 16
blocks:
  src:
    type: random_bits
    params:
      n_bits: 4000
  nrz:
    type: line_encoder
    params:
      symbol_rate: 100000000.0
  nrz_tx:
    type: pulse_shaper
    params:
      shape: rect
  man:
    type: line_encoder
    params:
      code: manchester
      symbol_rate: 200000000.0
  man_tx:
    type: pulse_shaper
    params:
      shape: rect
      sps: 4
  ami:
    type: line_encoder
    params:
      code: ami
      symbol_rate: 100000000.0
  ami_tx:
    type: pulse_shaper
    params:
      shape: rect
  mlt:
    type: line_encoder
    params:
      code: mlt3
      symbol_rate: 100000000.0
  mlt_tx:
    type: pulse_shaper
    params:
      shape: rect
edges:
- src.out -> nrz.in
- nrz.out -> nrz_tx.in
- src.out -> man.in
- man.out -> man_tx.in
- src.out -> ami.in
- ami.out -> ami_tx.in
- src.out -> mlt.in
- mlt.out -> mlt_tx.in
probes:
- key: nrz_tx.out
  view: spectrum
- key: man_tx.out
  view: spectrum
- key: ami_tx.out
  view: spectrum
- key: mlt_tx.out
  view: spectrum
layout:
  src:
  - 40.0
  - 40.0
  nrz:
  - 352.0
  - 48.0
  nrz_tx:
  - 620.0
  - 48.0
  man:
  - 352.0
  - 224.0
  man_tx:
  - 620.0
  - 224.0
  ami:
  - 352.0
  - 392.0
  ami_tx:
  - 620.0
  - 392.0
  mlt:
  - 352.0
  - 560.0
  mlt_tx:
  - 620.0
  - 560.0
