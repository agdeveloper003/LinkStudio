name: Synchronized QPSK receiver
category: Wireless
description: Unknown delay, carrier frequency offset and phase noise recovered by timing recovery,
  preamble-based frame sync and a decision-directed PLL. Compare the three constellations.
seed: 3
batch_size: 16
blocks:
  src: {type: random_bits, params: {n_bits: 2000}}
  map: {type: mapper, params: {scheme: psk, order: 4, symbol_rate: 1000000.0}}
  pre: {type: preamble, params: {length: 64, guard: 16}}
  tx: {type: pulse_shaper, params: {sps: 4, rolloff: 0.35}}
  tim: {type: timing_offset, params: {delay_samples: 9.37}}
  cfo: {type: carrier_offset, params: {cfo_hz: 3000.0, random_phase: true}}
  pn: {type: phase_noise, params: {linewidth_hz: 10.0}}
  awgn: {type: awgn, params: {snr_db: 12.0}}
  mf: {type: matched_filter, params: {decimate: false}}
  tr: {type: timing_recovery}
  fs: {type: frame_sync}
  cr: {type: carrier_recovery}
  demap: {type: demapper, params: {method: hard}}
  ber: {type: ber_meter}
chain: [src, map, pre, tx, tim, cfo, pn, awgn, mf, tr, fs, cr, demap, ber.rx]
edges:
  - src.out -> ber.tx
probes:
  - {key: tr.out, view: constellation}
  - {key: fs.out, view: constellation}
  - {key: cr.out, view: constellation}
