    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  mf:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  tr:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  fs:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  cr:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  demap:
    in:in:
    - right
    - 0.5
    out:out:
