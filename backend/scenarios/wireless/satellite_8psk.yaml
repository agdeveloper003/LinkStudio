name: Satellite link, 8-PSK with TWTA
category: Wireless
description: DVB-S2-like 8-PSK with RRC 0.35 through a traveling-wave tube amplifier
  (Saleh model) driven near saturation. The AM/PM rotation is removed by the decision-directed
  PLL. Lower pa.input_backoff_db to see the nonlinear distortion grow.
seed: 1
batch_size: 16
blocks:
  src:
    type: random_bits
    params:
      n_bits: 3000
  map:
    type: mapper
    params:
      scheme: psk
      order: 8
      symbol_rate: 30000000.0
  tx:
    type: pulse_shaper
    params:
      sps: 4
      span: 12
      rolloff: 0.35
  pa:
    type: power_amplifier
    params:
      model: saleh
  pn:
    type: phase_noise
    params:
      linewidth_hz: 200.0
  awgn:
    type: awgn
    params:
      snr_db: 16.0
      mode: esn0
  mf:
    type: matched_filter
  agc:
    type: agc
    params:
      remove_dc: false
  cr:
    type: carrier_recovery
  demap:
    type: demapper
    params:
      method: hard
  ber:
    type: ber_meter
  evm:
    type: evm_meter
edges:
- src.out -> map.in
- map.out -> tx.in
- tx.out -> pa.in
- pa.out -> pn.in
- pn.out -> awgn.in
- awgn.out -> mf.in
- mf.out -> agc.in
- agc.out -> cr.in
- cr.out -> demap.in
- demap.out -> ber.rx
- src.out -> ber.tx
- map.out -> evm.ref
- cr.out -> evm.in
probes:
- key: pa.out
  view: spectrum
- key: agc.out
  view: constellation
- key: cr.out
  view: constellation
layout:
  src:
  - 40.0
  - 66.0
  map:
