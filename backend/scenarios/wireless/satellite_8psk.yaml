  - 40.0
  tx:
  - 636.0
  - 74.0
  pa:
  - 953.0
  - 115.0
  pn:
  - 1191.0
  - 121.0
  awgn:
  - 1423.0
  - 107.0
  mf:
  - 1380.0
  - 347.0
  agc:
