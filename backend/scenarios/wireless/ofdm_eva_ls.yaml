  - 111.0
  awgn:
  - 1223.0
  - 107.0
  demod:
  - 1180.0
  - 347.0
  est:
  - 912.0
  - 368.0
  eq:
  - 644.0
  - 368.0
  demap:
  - 364.0
  - 347.0
  ber:
