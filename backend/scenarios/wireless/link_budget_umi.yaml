name: Urban micro-cell link budget
category: Wireless
description: QPSK at 10 Msym/s, 3.5 GHz, 23 dBm transmit power, over the 3GPP TR 38.901
  UMi street-canyon path loss (LOS drawn with the standard probability, log-normal
  shadowing per frame) into a receiver with 7 dB noise figure (thermal noise k T F
  B). Sweep pl.distance_m from 20 to 1000 m and watch path_loss_db, los_fraction and
  the frame error rate.
seed: 1
batch_size: 64
blocks:
  src:
    type: random_bits
    params:
      n_bits: 1000
  map:
    type: mapper
    params:
      scheme: psk
      symbol_rate: 10000000.0
  tx:
    type: gain
    params:
      gain_db: -7.0
  pl:
    type: path_loss
    params:
      model: umi
  awgn:
    type: awgn
    params:
      mode: thermal
      noise_figure_db: 7.0
  demap:
    type: demapper
    params:
      method: hard
  ber:
    type: ber_meter
edges:
- src.out -> map.in
- map.out -> tx.in
- tx.out -> pl.in
- pl.out -> awgn.in
- awgn.out -> demap.in
- demap.out -> ber.rx
- src.out -> ber.tx
probes:
- key: awgn.out
  view: constellation
layout:
  src:
  - 40.0
  - 66.0
  map:
  - 362.0
  - 40.0
  tx:
  - 666.0
  - 119.0
  pl:
  - 892.0
  - 101.0
  awgn:
  - 927.0
  - 380.0
  demap:
  - 624.0
  - 347.0
  ber:
  - 352.0
  - 328.0
port_layout:
  awgn:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  demap:
    in:in:
    - right
    - 0.5
    out:out:
    - left
    - 0.5
  ber:
    in:tx:
    - right
    - 0.25
    in:rx:
    - right
    - 0.75
